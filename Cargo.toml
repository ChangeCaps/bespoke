[package]
name = "bespoke"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["cli"]

[workspace.dependencies.bespoke]
version = "0.1.0"
path = "."

[dependencies]
base64 = "0.23"
bytes = "1"
serde = "1"
rmp-serde = "1"

[dependencies.tokio]
version =  "1"
default-features = false
features = ["net", "sync", "rt"]

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["stream"]

[dependencies.futures]
version = "0.3"
default-features = false
